name: Project time reminders

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-time-reminders.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: project-time-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check reminders each minute
        uses: actions/github-script@v8
        with:
          script: |
            // GitHub starts jobs at five-minute intervals. Each job checks five times.
            let completed = 0;
            for (let attempt = 0; attempt < 5; attempt++) {
              if (attempt > 0) await new Promise(resolve => setTimeout(resolve, 60000));
              try {
                const token = await core.getIDToken('bioana-project-time-reminders');
                const response = await fetch('https://www.bioanacentral.com/api/time-tracking/reminders', {
                  headers: { Authorization: `Bearer ${token}` },
                  signal: AbortSignal.timeout(25000),
                  redirect: 'error'
                });
                if (!response.ok) throw new Error(`Reminder endpoint returned ${response.status}`);
                const result = await response.json();
                core.info(`Checked ${result.checked} active sessions; ${result.failed} failed.`);
                completed++;
              } catch (error) {
                core.warning(error.message);
              }
            }
            if (completed === 0) core.setFailed('The reminder endpoint did not complete any check.');
