name: Bioana
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    BIOANA_BASE_URL: ""
targets:
  Bioana:
    type: application
    platform: iOS
    sources: [BioanaApp.swift, Destination.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bioana.shortcuts
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Bioana
        UILaunchScreen: {}
        NSCameraUsageDescription: Escanea los códigos QR de inventario en Bioana.
        BioanaBaseURL: $(BIOANA_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [bioana-shortcuts]
    dependencies:
      - target: BioanaWidget
        embed: true
  BioanaWidget:
    type: app-extension
    platform: iOS
    sources: [BioanaWidget.swift, Destination.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bioana.shortcuts.widget
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: Bioana
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
